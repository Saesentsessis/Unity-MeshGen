name: test-unity-plugin

##############################################################################
# 1. Triggers
##############################################################################
on:
  # Manual runs read UNITY_* from repository secrets directly.
  workflow_dispatch:
    inputs:
      projectPath:
        description: Unity test project to run
        required: true
        type: string
        default: ./Unity-Tests/2022.3.62f3
      unityVersion:
        description: Unity editor version (must match the project)
        required: true
        type: string
        default: 2022.3.62f3
      testMode:
        description: Test mode
        required: true
        type: choice
        options: [editmode, playmode, standalone]
        default: editmode
  workflow_call:
    inputs:
      projectPath: { required: true, type: string }
      unityVersion: { required: true, type: string }
      testMode: { required: true, type: string }
    secrets:
      UNITY_LICENSE: { required: true }
      UNITY_EMAIL: { required: true }
      UNITY_PASSWORD: { required: true }
      GH_PAT: { required: false }

##############################################################################
# 2. Job – run Unity tests via GameCI
##############################################################################
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        platform: [base, windows-mono]

    name: ${{ inputs.unityVersion }} ${{ inputs.testMode }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    # game-ci/unity-test-runner publishes results as a Check Run via githubToken,
    # which requires checks:write. Bounded by the caller's granted permissions.
    permissions:
      contents: read
      checks: write

    steps:
      # --------------------------------------------------------------------- #
      # 2-a. Checkout
      # --------------------------------------------------------------------- #
      - uses: actions/checkout@v4
        with:
          lfs: false

      # --------------------------------------------------------------------- #
      # 2-b. Free disk space
      # --------------------------------------------------------------------- #
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # --------------------------------------------------------------------- #
      # 2-c. Cache & run the Unity test-runner
      # --------------------------------------------------------------------- #
      - uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.projectPath }}/Library
            ~/.cache/unity3d
          # Content-based key: cache entries are immutable, so a fixed key would
          # never be refreshed. restore-keys falls back to the newest prior cache
          # for this config so Unity only reimports what changed.
          key: Library-${{ inputs.unityVersion }}-${{ inputs.testMode }}-${{ matrix.platform }}-${{ hashFiles(format('{0}/Assets/**', inputs.projectPath), format('{0}/Packages/**', inputs.projectPath), format('{0}/ProjectSettings/**', inputs.projectPath), 'Unity-MeshGen/Assets/root/**') }}
          restore-keys: |
            Library-${{ inputs.unityVersion }}-${{ inputs.testMode }}-${{ matrix.platform }}-

      - name: Generate custom image name
        id: custom_image
        run: echo "image=unityci/editor:ubuntu-${{ inputs.unityVersion }}-${{ matrix.platform }}-3" >> $GITHUB_OUTPUT
        shell: bash

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4.3.2
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ inputs.projectPath }}
          unityVersion: ${{ inputs.unityVersion }}
          testMode: ${{ inputs.testMode }}
          customImage: ${{ steps.custom_image.outputs.image }}
          githubToken: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          checkName: ${{ inputs.unityVersion }} ${{ inputs.testMode }} ${{ matrix.platform }} Test Results
          artifactsPath: artifacts-${{ inputs.unityVersion }}-${{ inputs.testMode }}-${{ matrix.platform }}
          customParameters: -CI true -GITHUB_ACTIONS true

      # --------------------------------------------------------------------- #
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test results for ${{ inputs.unityVersion }} ${{ inputs.testMode }} on ${{ matrix.platform }}
          path: ${{ steps.tests.outputs.artifactsPath }}